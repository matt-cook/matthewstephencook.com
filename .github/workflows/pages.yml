name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Production uses a custom-domain root even if Pages reports the repository path.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'matthewstephencook.com' }}
          CMS_REPOSITORY: ${{ github.repository }}
          CMS_BRANCH: main
          CMS_AUTH_BASE_URL: ${{ vars.CMS_AUTH_BASE_URL }}
          CMS_AUTH_ENDPOINT: ${{ vars.CMS_AUTH_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
